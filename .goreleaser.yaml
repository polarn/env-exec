# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: env-exec-binary
    binary: env-exec
    main: ./cmd/env-exec/main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE
      - completions/env-exec.bash
      - completions/_env-exec
      - completions/env-exec.fish

changelog:
  use: github-native

aurs:
  - name: env-exec-bin
    license: Apache-2.0
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/env-exec-bin.git"
    homepage: "https://github.com/polarn/env-exec"
    description: "A tool to inject environment variables from various sources (GCP Secrets Manager, GitLab) before executing commands"
    maintainers:
      - "Marcus Johansson <polarn@polarn.net>"
    package: |-
      install -Dm755 "./env-exec" "${pkgdir}/usr/bin/env-exec"
      install -Dm644 "./completions/env-exec.bash" "${pkgdir}/usr/share/bash-completion/completions/env-exec"
      install -Dm644 "./completions/_env-exec" "${pkgdir}/usr/share/zsh/site-functions/_env-exec"
      install -Dm644 "./completions/env-exec.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/env-exec.fish"

homebrew_casks:
  - name: env-exec
    repository:
      owner: polarn
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/polarn/env-exec"
    description: "The Environment variable executor"
    completions:
      bash: completions/env-exec.bash
      zsh: completions/_env-exec
      fish: completions/env-exec.fish

nfpms:
  - id: env-exec-packages
    package_name: env-exec

    formats:
      - deb
      - rpm

    vendor: polarn.net
    homepage: "https://github.com/polarn/env-exec"
    maintainer: Marcus Johansson <polarn@polarn.net>
    description: "A tool to inject environment variables from various sources (GCP Secrets Manager, GitLab) before executing commands"
    license: Apache-2.0

    contents:
      - src: completions/env-exec.bash
        dst: /usr/share/bash-completion/completions/env-exec
      - src: completions/_env-exec
        dst: /usr/share/zsh/vendor-completions/_env-exec
        packager: deb
      - src: completions/_env-exec
        dst: /usr/share/zsh/site-functions/_env-exec
        packager: rpm
      - src: completions/env-exec.fish
        dst: /usr/share/fish/vendor_completions.d/env-exec.fish

publishers:
  - name: apt-repo-webdav
    ids:
      - env-exec-packages
    cmd: |
      bash -c '
      if [[ "{{ .ArtifactPath }}" == *.deb ]]; then
        curl -T {{ .ArtifactPath }} \
          -u apt:{{ .Env.APT_WEBDAV_PASSWORD }} \
          https://webdav.polarn.net/apt/$(basename {{ .ArtifactPath }})
      else
        echo "Skipping non-deb file: {{ .ArtifactPath }}"
      fi
      '
    env:
      - APT_WEBDAV_PASSWORD
